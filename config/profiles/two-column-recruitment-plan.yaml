name: two-column-recruitment-plan
description: 双栏“院校行 + 专业行”普通高校征集志愿计划；支持扫描 PDF 和图片。
priority: 90
match:
  text_contains:
    - 普通高校招生征集志愿计划
    - 学校(专业及专业方向)
    - 再选科目
    - 计划学制学费
parser: two_column_hierarchical_plan
page_regions:
  left:
    page: [0.00, 0.50]
    description: [0.05, 0.275]
    subject: [0.275, 0.374]
    plan: [0.374, 0.413]
    duration: [0.413, 0.440]
    tuition: [0.440, 0.500]
  right:
    page: [0.50, 1.00]
    description: [0.515, 0.742]
    subject: [0.742, 0.830]
    plan: [0.830, 0.868]
    duration: [0.868, 0.895]
    tuition: [0.895, 1.000]
school_pattern: '^(\d{4})\s*(.+)$'
major_pattern: '^([0-9A-Za-z]{2})\s*(.+)$'
subject_keywords:
  - 化学和生物
  - 思想政治
  - 化学
  - 生物
  - 地理
  - 不限
required:
  - 院校代码
  - 院校名称
  - 院校计划总数
  - 专业代码
  - 专业名称及专业方向
  - 计划数
integer_fields:
  - 院校计划总数
  - 计划数
  - 学制
code_patterns:
  院校代码: '\d{4}'
  专业代码: '\d{2}'
code_fields:
  - 院校代码
  - 专业代码
cell_ocr_refinement:
  enabled: true
  scale: 8
  minimum_score: 0.90
  fields:
    院校计划总数:
      row: school
      band: plan
      pattern: '\d{1,3}'
    计划数:
      row: major
      band: plan
      pattern: '\d{1,3}'
skip_if_contains:
  - 普通高校招生征集志愿计划
  - 特别提示
  - 征集计划中部分院校
  - 部分院校没有注明
  - 关要求被院校退档
  - 代号 学校
  - 名称与说明
  - 元/年
review_all: false
