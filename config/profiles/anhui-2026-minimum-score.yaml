name: anhui-2026-minimum-score
description: 安徽省 2026 年国家专项首轮投档最低分及名次表（历史/物理）。
priority: 100
match:
  path_contains:
    - anhui/2026
    - 国家专项计划首轮
    - 最低分
    - 名次
parser: spatial_rows
columns:
  - name: 院校代码
    x_min: 0.00
    x_max: 0.10
    type: code
  - name: 院校名称
    x_min: 0.10
    x_max: 0.36
    type: text
  - name: 专业组
    x_min: 0.36
    x_max: 0.67
    type: text
  - name: 投档人数
    x_min: 0.67
    x_max: 0.76
    type: integer
  - name: 最低分
    x_min: 0.76
    x_max: 0.87
    type: integer
  - name: 最低分名次
    x_min: 0.87
    x_max: 1.00
    type: integer
required: [院校代码, 院校名称, 专业组, 最低分, 最低分名次]
code_fields: [院校代码]
fill_down: []
skip_if_contains:
  - 院校代码
minimum_populated_fields: 4
review_all: false
