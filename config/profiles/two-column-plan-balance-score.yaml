name: two-column-plan-balance-score
description: 双栏“院校专业组行 + 专业行”，包含计划余额和分数线；支持扫描 PDF 和图片。
priority: 95
match:
  text_contains:
    - 征集志愿高校分专业名单
    - 学校(专业及专业方向)名称与说明
    - 余额线
parser: two_column_plan_balance_score
constants:
  数据类型: 征集计划
  招生类型: 普通本科批征集志愿
  批次: 普通本科批
page_regions:
  left:
    page: [0.00, 0.50]
    description: [0.05, 0.42]
    numeric: [0.42, 0.50]
    group_plan: [0.42, 0.455]
    major_plan: [0.42, 0.455]
    score: [0.455, 0.50]
    score_split: 0.455
  right:
    page: [0.50, 1.00]
    # 部分扫描件的右栏院校行会从 0.51 左侧起始；page 已隔离左右两栏。
    description: [0.50, 0.86]
    numeric: [0.86, 1.00]
    group_plan: [0.86, 0.915]
    major_plan: [0.86, 0.915]
    score: [0.915, 1.00]
    score_split: 0.915
school_pattern: '^(?P<institution_code>\d{4})\s*(?P<institution_name>.+?)\s*第(?P<group_code>[0-9A-Za-z]{3})组[（(](?P<group_name>.+?)[）)]$'
major_pattern: '^(?P<major_code>[0-9A-Za-z]{2})\s*(?P<major_name>.+)$'
course_pattern: '(历史类|物理类)'
subject_pattern: '再选\s*[:：]\s*(.+)$'
minimum_critical_ocr_score: 0.85
required:
  - 科类
  - 再选科目
  - 院校代码
  - 院校名称
  - 院校专业组代码
  - 专业组计划数
  - 专业代码
  - 专业名称及专业方向
  - 计划数
  - 分数线
integer_fields:
  - 专业组计划数
  - 计划数
  - 分数线
code_fields:
  - 院校代码
  - 院校专业组代码
  - 专业组代码
  - 专业代码
cell_ocr_refinement:
  enabled: true
  scale: 8
  minimum_score: 0.90
  numeric_pair_ocr:
    enabled: true
    band: numeric
    scale: 8
    minimum_score: 0.90
  fields:
    专业组计划数:
      row: group
      band: group_plan
      pattern: '\d{1,3}'
    计划数:
      row: major
      band: major_plan
      pattern: '\d{1,3}'
    分数线:
      row: major
      band: score
      pattern: '(?:[0-6]\d{2}|7[0-4]\d|750)'
      accept_if_source_invalid: true
verified_record_corrections:
  - label: '河南2026第35页周口师范学院第902组漏标题'
    expected_matches: 1
    scope_contains:
      来源文件: '普通本科批征集志愿高校分专业名单（508所）.pdf'
    match:
      来源页: '35'
      _major_side: right
      院校代码: '6055'
      专业组代码: '901'
      专业代码: '70'
    contains:
      专业名称及专业方向: '融媒体应用开发'
    set:
      院校代码: '6060'
      院校名称: '周口师范学院'
      院校专业组代码: '6060902'
      专业组代码: '902'
      院校专业组名称: '周口师范学院 第902组(单列专业组)'
      专业组计划数: '9'
    note: '源 PDF 第35页右栏人工核验：补回 OCR 漏识别的 6060 周口师范学院第902组标题'
skip_if_contains:
  - 征集志愿高校分专业名单
  - 考生选报征集志愿时
  - 学校(专业及专业方向)名称与说明
  - 计划分数
  - 余额线
  - 第页，共页
